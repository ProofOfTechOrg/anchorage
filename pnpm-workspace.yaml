packages:
  - "packages/*"

minimumReleaseAge: 10080
# Mastra ships in lockstep with @mastra/core (audited, version-locked here);
# quarantining it just forces stale mismatched subtrees.
minimumReleaseAgeExclude:
  # Approved September 5 for the current Wrangler runtime upgrade only.
  - "wrangler@4.129.0"
  - "miniflare@5.20260903.0-alpha"
  - "@mastra/*"
  # Astryx (Meta design system) is Beta and ships faster than the 7-day gate;
  # versions are pinned exact in packages/flowsafe to bound the exposure.
  - "@astryxdesign/*"
  # Cloudflare runtime packages follow Wrangler's exact workerd/miniflare pins;
  # Workers type releases also ship faster than the gate. Keep resolved versions
  # locked while admitting those toolchain releases.
  - "@cloudflare/*"
  - "workerd"
  # Forced by wrangler → miniflare → sharp; already lockfile-pinned — the gate
  # only re-fires because any lockfile update re-resolves the whole graph.
  - "@emnapi/runtime"
  # Future release-age exceptions require explicit user approval.
  - "deslop-js"
