name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new run cancels the in-flight one for the same ref and event. The event
# name is part of the key, so the push run and the pull_request run for one
# commit sit in different groups and neither cancels the run the required
# check reads. The separation must not rest on `github.ref` differing per
# event, which is why the key names the event: a trigger added on a branch ref
# would otherwise share the push run's group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# These jobs only read the repo — and the compat job deliberately executes
# packages younger than the workspace release-age buffer, so the token it
# can reach must stay read-only.
permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The repo's verification gate, in order.

      # Every .github YAML file, not just this one: a workflow that does not
      # trigger on a PR, and an issue template with no trigger at all, are
      # otherwise parsed for the first time after the change lands.
      - name: Check .github YAML syntax
        run: pnpm github:check

      - name: Test the .github YAML checker and the verify gate it pins
        run: pnpm github:check:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Root vitest workspace: every package's suite in one process, minus the
      # direct scenario projects, which the jobs below run at
      # the same time. The Typecheck step above produces the fleet-control dist
      # this step consumes: fleet-control's `pretypecheck` runs its `prebuild`
      # and `build`. The cap is about 1.8x the slowest measured run of this step
      # (968 s), so it clears a slow run; it is the cap that fires first only
      # while the job's other steps leave the 45-minute job budget unspent.
      - name: Test
        timeout-minutes: 30
        run: pnpm test:without-direct-scenario

      - name: Build
        run: pnpm build

      # The `mint` cases in scripts/entry-point.test.mjs run the agent-starter
      # token script against flowsafe's built `approval-api` entry, so this step
      # needs the Build step's output.
      - name: Test root Node tools
        run: pnpm test:node-tools

      - name: Check documentation
        run: pnpm docs:check

      - name: Test documentation checker
        run: pnpm docs:check:test

      - name: Build API documentation
        run: pnpm docs:api

      - name: Verify release package order
        run: pnpm test:release-order

      # Catches a malformed publish command on the PR that introduces it, rather
      # than on main where the only symptom is a failed release. release.yml
      # repeats it as a pre-flight; see the script header for what it covers.
      - name: Verify release publish invocation
        run: pnpm test:release-invocation

      # Build and install the actual tarball in an offline consumer. Keep this
      # after Build so manifest exports, declarations, docs, and runtime imports
      # are verified against the publish surface rather than workspace source.
      - name: Verify packed breakwater surface
        run: pnpm test:packed-breakwater

      # fleet-control's `./workers/*` export entries are Workers entry points.
      # `packages/fleet-control/scripts/packed-consumer-test.mjs` packs and
      # consumes the tarball, resolving those entries through the package
      # boundary and asserting the trusted-configuration constructor still
      # fails closed in the published artifact.
      - name: Verify packed fleet-control surface
        run: pnpm test:packed-fleet-control

      # The guarded host is subpath-only and carries an optional Breakwater
      # peer. Compile and import the packed tarball so the export, declarations,
      # peer floor, and runtime graph are checked as a consumer sees them.
      - name: Verify packed flowsafe agent-host surface
        run: pnpm test:packed-flowsafe-agent-host

      # Invoke the installed-bin shape from the packed tarball so symlinked npm
      # executables, Wrangler peer resolution, and CLI argument handling are
      # verified as a consumer sees them.
      - name: Verify packed flowsafe provisioning CLI
        run: pnpm test:packed-flowsafe-provisioning

      # Pack the built package and resolve the public deep import under browser
      # conditions. This catches Node-only transitive imports that source-level
      # tests cannot see.
      - name: Verify browser-clean signals client export
        run: pnpm --filter @proofoftech/flowsafe test:signals-client-export

      # Peer-floor probe: the approval-ui d.ts is EMITTED under
      # @types/react@19; this compiles the built dist against aliased
      # @types/react@18 (skipLibCheck OFF), proving the React >=18 peer range
      # the package declares. Needs the Build step's dist.
      - name: Typecheck approval-ui at the react-18 peer floor
        run: pnpm --filter @proofoftech/flowsafe typecheck:react18

      # React quality gate: the FULL react-doctor scan over the showcase app
      # (pre-push runs the fast changed-files subset; this is the
      # authoritative pass, incl. dead-code rules that only run at full scope).
      # The wrapper pins the audited analyzer commit and rejects skipped or
      # incomplete checks even if the analyzer process itself exits zero.
      - name: React Doctor (full gate)
        timeout-minutes: 10
        run: pnpm --filter showcase run react-doctor

      # End-to-end durability proof on real workerd (local mode, no
      # Cloudflare credentials): suspend -> process kill -> restart on
      # persisted D1 state -> approval-decided resume -> forged-resume
      # fails closed. Exits non-zero on any broken link in that chain.
      - name: Spike verify (workerd suspend/resume)
        run: pnpm --filter @proofoftech/flowsafe spike:verify

      # The Workers for Platforms artifact contract. The paid gate
      # (pnpm fleet-control:credentialed) needs a scratch account with a
      # subscription, so the steps below are what stands between a contract
      # change and finding out on a billed run: `test:conformance-config`
      # proves the shipped operator configuration still satisfies fleet
      # control's own validators and matches the harness wrangler configs, and
      # `conformance:verify` builds every artifact `build-conformance.mjs`'s
      # `ARTIFACTS` list declares and drives every locally-provable action on
      # real workerd, including one approval suspended across the v1-to-v2
      # release update.
      - name: Verify the conformance operator configuration
        run: pnpm test:conformance-config

      - name: Conformance artifacts verify (workerd)
        run: pnpm conformance:verify

  # The direct credentialed scenario and offline fence suites run against the
  # reference and tenant Workers on local workerd in about 35 minutes,
  # independent of every `verify-core` step. They import flowsafe subpaths and
  # fleet-control from their dists, so this job builds fleet-control and its
  # prerequisites before running them.
  direct-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build fleet-control and its prerequisites
        run: pnpm --filter @proofoftech/fleet-control build

      - name: Direct scenario suites (workerd)
        run: pnpm test:direct-scenario:fast

  # The process-loss direct scenario suites run in their own project. They
  # import flowsafe subpaths and fleet-control from their dists, so this job
  # builds fleet-control and its prerequisites before running them.
  direct-scenario-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build fleet-control and its prerequisites
        run: pnpm --filter @proofoftech/fleet-control build

      - name: Direct scenario process-loss suites (workerd)
        run: pnpm test:direct-scenario:seams

  # The `protect main` ruleset requires the status check named `verify`. This
  # job is that check: it depends on the gating jobs and fails unless `needs`
  # carries at least one entry and every entry reports success, so a red or
  # cancelled direct-scenario job blocks a merge to main exactly as a red
  # `verify-core` does. A job added to `needs` is gating without a further edit
  # because the assertion reads the whole context, and an emptied `needs` list
  # fails the check instead of passing it with nothing verified.
  # `if: always()` makes the job run when a dependency fails or is cancelled;
  # without it the job would be skipped, and GitHub reports a skipped job as
  # success for a required check.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [verify-core, direct-scenario, direct-scenario-seams]
    if: always()
    steps:
      - name: Require a non-empty needs context in which every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$NEEDS" | jq -e 'to_entries | length > 0 and all(.value.result == "success")' > /dev/null

  # Mastra compat matrix: the libraries pin behavioral contracts to
  # @mastra/core internals (resume-context merge-over semantics, snapshot
  # shape, the reprocess-part key, the adapter's table inventory). The supported
  # peer is exactly 1.67.0; run the library suites against the newest
  # published 1.x as a signal for a deliberate future compatibility update.
  # Tripwires the job exercises include the runtime.test.ts merge pin, the
  # ProcessorRunner reprocess-key probe, mastra-schema-guard, the
  # durable-agent-surface inventory, breakwater's own agent.test.ts
  # Agent.prototype inventory (whose forwardClassified allowlist is asserted
  # against THIS job's newer core, not just the pin), and, through the
  # typecheck step, d1-storage.ts's storage-domain capture. See the maintainer
  # guide's Mastra compatibility section for why bundling needs its own step.
  mastra-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A signal, not a merge gate: a probe failure against the newest core reds
    # this job, and `verify`'s `needs` list does not name it, so that red is a
    # release investigation rather than a merge blocker.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Not committed: bump only @mastra/core (and its D1 adapter, which
      # must ride the same core) to the newest 1.x in this job's workspace,
      # then run both library suites against it. The update runs with the
      # release-age gate OFF (--config.minimum-release-age=0): the newest
      # core routinely pins TRANSITIVE deps younger than the workspace's
      # 7-day buffer (1.51.0 -> @a2a-js/sdk ~0.3.14 at 6 days), which the
      # @mastra/* exclude does not cover and which would wedge the probe on
      # ERR_PNPM_NO_MATURE_MATCHING_VERSION. Scoped to this one resolution;
      # every real install keeps the workspace gate.
      # What the run reports includes: the typecheck below, whose red names a
      # type the newest core changed, such as a storage domain that
      # packages/flowsafe/src/do-runner/d1-storage.ts's exhaustive capture does
      # not name; both packages' surface inventories, whose red names either
      # the member nobody has read yet or the skew row that stopped being true,
      # in its own message; and notification-source-keys.test.ts, whose cases
      # hold the newest core to the own-key behaviour mastra-ai/mastra#23693
      # and #23694 fixed. See the maintainer guide's Mastra compatibility
      # section.
      - name: Bump @mastra/core to newest 1.x
        id: mastra_versions
        run: |
          BASELINE_CORE=$(node -p "require('./packages/breakwater/package.json').devDependencies['@mastra/core']")
          BASELINE_D1=$(node -p "require('./packages/flowsafe/package.json').dependencies['@mastra/cloudflare-d1']")
          # A registry blip reds the probe for the wrong reason, so a lookup is
          # retried; an E404 is a permanent answer that ends the attempts.
          # Errexit does not reach inside `$( )`, so the function tests each
          # stage itself: the lookup through `if`, the reduction through `||`
          # and a non-empty result. The fetch bounds keep one attempt from
          # spending the job's budget inside npm's own retries.
          newest_version() {
            local attempt output version
            for attempt in 1 2 3; do
              [ "$attempt" -eq 1 ] || sleep 20
              if output=$(timeout --signal=KILL 90s npm view "$1" version --json --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=5000); then
                version=$(printf '%s' "$output" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(Array.isArray(d)?d.at(-1):d)') || return 1
                [ -n "$version" ] || return 1
                printf '%s\n' "$version"
                return 0
              else
                status=$?
              fi
              if [ "$status" -eq 1 ]; then
                case "$output" in *E404*) break ;; esac
              fi
              case "$status" in
                125|126|127)
                  printf 'timeout wrapper failed with status %s\n' "$status" >&2
                  return 1
                  ;;
              esac
            done
            printf 'npm view %s failed: %s\n' "$1" "$output" >&2
            return 1
          }
          CORE_VERSION=$(newest_version '@mastra/core@^1')
          D1_VERSION=$(newest_version '@mastra/cloudflare-d1@^1')
          echo "core=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "d1=$D1_VERSION" >> "$GITHUB_OUTPUT"
          echo "baseline_core=$BASELINE_CORE" >> "$GITHUB_OUTPUT"
          echo "baseline_d1=$BASELINE_D1" >> "$GITHUB_OUTPUT"
          pnpm -r update --config.minimum-release-age=0 "@mastra/core@$CORE_VERSION" "@mastra/cloudflare-d1@$D1_VERSION"
          pnpm --filter @proofoftech/breakwater list @mastra/core
          pnpm --filter @proofoftech/flowsafe list @mastra/core @mastra/cloudflare-d1

      # The bump must PROVABLY install both registry versions captured above;
      # otherwise this job can silently re-test a pinned version and a green
      # run means nothing.
      - name: Assert the newest 1.x packages are installed
        env:
          BASELINE_CORE: ${{ steps.mastra_versions.outputs.baseline_core }}
          BASELINE_D1: ${{ steps.mastra_versions.outputs.baseline_d1 }}
          EXPECTED_CORE: ${{ steps.mastra_versions.outputs.core }}
          EXPECTED_D1: ${{ steps.mastra_versions.outputs.d1 }}
        run: |
          INSTALLED_CORE=$(pnpm --filter @proofoftech/breakwater exec node -p 'require("@mastra/core/package.json").version')
          INSTALLED_D1=$(pnpm --filter @proofoftech/flowsafe exec node -p 'require("@mastra/cloudflare-d1/package.json").version')
          relation() {
            node -e 'const [baseline,requested]=process.argv.slice(1); const valid=/^\d+\.\d+\.\d+$/; if(!valid.test(baseline)||!valid.test(requested)){console.error(`unusable version pair ${baseline} / ${requested}`);process.exit(2);} const order=(left,right)=>{const a=left.split(".").map(Number);const b=right.split(".").map(Number);for(let i=0;i<a.length;i+=1){if(a[i]!==b[i])return a[i]-b[i];}return 0;}; if(baseline===requested)console.log("equality");else if(order(requested,baseline)>0)console.log("newer");else{console.error(`requested ${requested} is older than baseline ${baseline}`);process.exit(1);}' "$1" "$2"
          }
          CORE_COVERAGE=$(relation "$BASELINE_CORE" "$EXPECTED_CORE")
          D1_COVERAGE=$(relation "$BASELINE_D1" "$EXPECTED_D1")
          echo "core: baseline=$BASELINE_CORE requested=$EXPECTED_CORE installed=$INSTALLED_CORE coverage=$CORE_COVERAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "d1: baseline=$BASELINE_D1 requested=$EXPECTED_D1 installed=$INSTALLED_D1 coverage=$D1_COVERAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$EXPECTED_CORE" = "$INSTALLED_CORE"
          test "$EXPECTED_D1" = "$INSTALLED_D1"

      # continue-on-error keeps an expected red from skipping the bundling and
      # tripwire steps below; the final step is what carries the outcome to the
      # job status.
      - name: Typecheck libraries against newest core
        id: typecheck
        continue-on-error: true
        run: pnpm --filter @proofoftech/breakwater typecheck && pnpm --filter @proofoftech/flowsafe typecheck

      # Bundles the flowsafe spike Worker so this job can see a published-dist
      # bundling regression that typecheck and test structurally cannot.
      - name: Bundle the flowsafe spike Worker against newest core
        id: bundle
        continue-on-error: true
        run: pnpm --filter @proofoftech/flowsafe spike:bundle-check

      - name: Test libraries against newest core
        id: tests
        run: pnpm --filter @proofoftech/breakwater test && pnpm --filter @proofoftech/flowsafe test

      # The typecheck and bundle steps swallow their own status, so this step
      # is what carries a red probe to the job status; the tripwire suites red
      # it themselves. The summary lines report a flip (upstream fix, or a new
      # regression) without opening the log, and the condition reaches them
      # past a red suite without running after cancellation.
      - name: Fail the job on a red probe
        id: probe_outcome
        if: ${{ !cancelled() }}
        run: |
          echo "library typecheck against newest core: ${{ steps.typecheck.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "spike bundle against newest core: ${{ steps.bundle.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "library suites against newest core: ${{ steps.tests.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.typecheck.outcome }}" = failure ] || [ "${{ steps.bundle.outcome }}" = failure ]; then
            exit 1
          fi
