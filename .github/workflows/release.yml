name: Release

# Publish half of the bump-on-dev release flow (the version half is
# version.yml, which maintains the "Version Packages" PR against dev). Version
# bumps arrive on main INSIDE the release PR (dev -> main), so this workflow
# never opens PRs and never creates commits: it publishes any public package
# whose package.json version is not yet on npm, creates git tags, pushes them,
# and creates GitHub releases. A push to main with nothing unpublished is a
# clean no-op.
#
# The tripwire below is the freeze-window guard: a pending changeset file on
# main means a feature merged into dev AFTER the Version Packages PR was
# merged but BEFORE the release PR — its changes would publish under a version
# whose changelog never saw them. That must be a loud failure, never a silent
# mispublish: merge the regenerated Version Packages PR into dev and re-cut
# the release PR.
#
# Publishes through npm trusted publishing: npm exchanges the job's OIDC token
# (id-token: write) for a short-lived publish credential when the package's
# trusted publisher names this repository, release.yml and the `npm`
# environment. npm checks no branch, so the `npm` environment's deployment
# branch policy is what limits publishing to main. When the exchange fails,
# npm publishes with the NPM_TOKEN secret instead and reports no error;
# docs/maintainer-guide.md "Release flow" covers both credentials and how to
# tell which one published. NPM_CONFIG_PROVENANCE below requests provenance on
# both paths: without it, npm enables provenance for an OIDC publish only after
# a separate visibility lookup succeeds. A refused publish uploads nothing for
# that package. `showcase` is private and never publishes.

on:
  push:
    branches: [main]

# A publish must not be cancelled mid-run because cancellation can leave a
# prerequisite published before its tag and dependent packages exist. With one
# pending run per concurrency group, a third push replaces the queued run.
concurrency: release-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    # scripts/github-yaml-check.test.mjs checks this budget from constants in
    # scripts/publish-ordered.mjs: both probes for each prerequisite, its
    # visibility deadline, and a policy reserve. It does not bound publish time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets reads history to decide what changed since the last tag.
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # No pnpm store cache: any push-triggered CI job can write the shared
      # key, and this job publishes to npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Refuse pending changesets (freeze-window tripwire)
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')
          if [ -n "$PENDING" ]; then
            echo "::error::Unversioned changesets reached main. Merge the regenerated 'Version Packages' PR into dev, then re-cut the release PR (dev -> main)."
            echo "$PENDING"
            exit 1
          fi

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # prepack cleans and builds each package again at publish time; this build
      # front-loads failures so a broken build never reaches the registry.
      - name: Build
        run: pnpm build

      # ci.yml runs this too, but a push to main starts ci.yml and this workflow
      # CONCURRENTLY and this job does not wait for CI's result, so a red CI
      # cannot stop a publish. Repeating it here fails in this job, before the
      # publish step, on this checkout. It is fully offline and adds no new
      # dependency, but it runs each prerequisite's prepack build, so it is not
      # free.
      - name: Verify release publish invocation
        run: pnpm test:release-invocation

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10;
      # pnpm publish hands the packed tarball to the npm on PATH. This runs
      # after the invocation check because npm 11's dry run reads the registry
      # and refuses a version that is already published. npm 12 changes
      # install-time defaults, so the pin is an 11.x release, and the pinned
      # sha512 keeps a substituted registry copy from installing.
      - name: Install npm for trusted publishing
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/npm.tgz" \
            https://registry.npmjs.org/npm/-/npm-11.21.0.tgz
          echo "668bfc2a16a63677a22dd10bb63e5800bb4d9895b82f87c22d3ce37e9cd71b6c3a3121dc7f453181d94ae6e9680ae92c593fbb986514ef08bbf5c3ba46a8af3e  $RUNNER_TEMP/npm.tgz" | sha512sum --check --strict -
          npm install --global --ignore-scripts "$RUNNER_TEMP/npm.tgz"
          test "$(npm --version)" = 11.21.0

      # Publish Breakwater, then Flowsafe, each waiting for registry
      # visibility, before Changesets fans out over the remainder. Flowsafe needs
      # Breakwater for its agent-host peer floor, and fleet-control packs an
      # exact Flowsafe version, so a concurrent publish could strand it on the
      # registry depending on a version that never appeared.
      - name: Publish unpublished versions to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used only when the OIDC exchange fails, such as for a package whose
          # trusted publisher is missing or expired.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
